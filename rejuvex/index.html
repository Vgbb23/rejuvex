<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejuvex Ultra - Suplemento de beleza em cápsulas</title>
    <meta
      name="description"
      content="Rejuvex Ultra combina colágeno hidrolisado, resveratrol, ácido hialurônico, biotina e retinol para apoiar uma rotina de beleza de dentro para fora."
    />
    <!-- UTMify: pixel + UTMs em todas as rotas (shell único do Vite/React) -->
    <script>
      window.pixelId = "6a28b6e8c15bd05de9dedc18";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>
    <link rel="stylesheet" crossorigin href="./src/main.css" />
    <style>
      body {
        background: #fffaf1;
      }

      [class*="bg-[#4A8FA8]"] {
        background-color: #b78b42 !important;
      }

      [class*="bg-[#523741]"] {
        background-color: #2a2620 !important;
      }

      [class*="bg-[#F2E6EB]"] {
        background-color: #f3eadc !important;
      }

      [class*="bg-[#FFFAFB]"] {
        background-color: #fffaf1 !important;
      }

      [class*="text-[#4A8FA8]"] {
        color: #b78b42 !important;
      }

      [class*="text-[#523741]"] {
        color: #2a2620 !important;
      }

      [class*="text-[#8A6B7A]"],
      [class*="text-[#C9B0BD]"] {
        color: #7a7165 !important;
      }

      [class*="text-[#F2E6EB]"],
      [class*="text-[#DEC9D1]"] {
        color: #ead6a3 !important;
      }

      [class*="border-[#4A8FA8]"],
      [class*="border-[#8A6B7A]"],
      [class*="border-[#E8D5DE]"],
      [class*="border-[#F2E6EB]"] {
        border-color: #ead6a3 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (event) {
        var root = document.getElementById("root");
        if (!root || root.children.length) return;
        root.innerHTML =
          '<pre style="white-space:pre-wrap;margin:24px;padding:18px;border:1px solid #ead6a3;border-radius:12px;background:#fffaf1;color:#2a2620;font-family:monospace">Erro ao carregar a página:\\n' +
          String(event.message || "Erro desconhecido") +
          "</pre>";
      });
      window.addEventListener("unhandledrejection", function (event) {
        var root = document.getElementById("root");
        if (!root || root.children.length) return;
        var reason = event.reason && (event.reason.stack || event.reason.message || event.reason);
        root.innerHTML =
          '<pre style="white-space:pre-wrap;margin:24px;padding:18px;border:1px solid #ead6a3;border-radius:12px;background:#fffaf1;color:#2a2620;font-family:monospace">Erro ao carregar a página:\\n' +
          String(reason || "Promessa rejeitada") +
          "</pre>";
      });
    </script>
    <script type="module" crossorigin src="./src/main.js"></script>
  </body>
</html>
